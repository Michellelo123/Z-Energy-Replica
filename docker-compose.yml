services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://host.docker.internal:27017/homepage

  seeder:
    build: ./backend
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/homepage
    command: node homepage-backend/CLI/z-cli.js seed
    depends_on:
      - backend
    restart: "no"